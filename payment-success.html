<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | AJP PIXELS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 80px 20px;
            color: #333;
        }

        .success-card {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 40px 25px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        .check {
            color: #198754;
            font-size: 60px;
        }

        h1 {
            color: #198754;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #c9a227;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="check">✓</div>
        <h1>Thank You for Your Payment!</h1>
        <p>
            Your payment was submitted successfully.
            Thank you for choosing AJP PIXELS.
        </p>
        <p id="status">Verifying your payment...</p>
        <a href="my-booking.html">Return to My Booking</a>
    </div>

    <script>
        async function verifyPayment() {
            const status = document.getElementById("status");
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get("session_id");

            if (!sessionId) {
                status.textContent =
                    "Payment confirmation is missing. Please contact us.";
                return;
            }

            try {
                const response = await fetch(
                    "https://dqomzsokiqopdkvrf.supabase.co/functions/v1/verify-payment",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            session_id: sessionId
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.error || "Payment verification failed."
                    );
                }

                status.textContent =
                    "Payment verified! Your booking has been updated.";
            } catch (error) {
                console.error("Payment verification error:", error);
                status.textContent =
                    "Your payment was received, but your booking update is pending. Please contact us.";
            }
        }

        verifyPayment();
    </script>
</body>
</html>
